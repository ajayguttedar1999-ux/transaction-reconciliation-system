name: 📱 Android Mobile Build (APK & Play Store AAB)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 🤖 Compile Android APK & Google Play AAB
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: ☕ Set up Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🤖 Set Android SDK Environment & Install API 34
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: 📦 Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: 🏗️ Build Web Distribution
        working-directory: frontend
        run: npm run build

      - name: 🔄 Copy Web Assets into Android
        working-directory: frontend
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: 🔨 Grant Execute Permission for Gradlew
        working-directory: frontend/android
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: 📱 Compile Debug APK
        working-directory: frontend/android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon > gradle.log 2>&1 || STATUS=$?
          cat gradle.log
          if [ "${STATUS:-0}" -ne 0 ]; then
            echo "### ❌ Gradle Build Failed (Exit Code: $STATUS)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 gradle.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $STATUS
          fi

      - name: 📦 Compile Play Store Bundle (AAB)
        working-directory: frontend/android
        run: ./gradlew bundleDebug --no-daemon || true

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: recon-platform-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

      - name: 📤 Upload Play Store Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: recon-platform-bundle-aab
          path: frontend/android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: warn

      - name: 🚀 Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: "📱 Recon Platform Mobile App (Android APK)"
          body: |
            ### 📱 Recon Platform - Android Installation File
            Download **`app-debug.apk`** below directly to your Android device to install and test!
            
            - **App:** Recon Platform
            - **Package:** `com.ajay.reconplatform`
            - **Author:** Ajay
          files: |
            frontend/android/app/build/outputs/apk/debug/app-debug.apk
            frontend/android/app/build/outputs/bundle/debug/app-debug.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
