name: 📱 Android Mobile Build (APK & Play Store AAB)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 🤖 Compile Android APK & Google Play AAB
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: ☕ Set up Java 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Frontend Dependencies & Build
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: 🔨 Grant Execute Permission for Gradlew
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: 📱 Compile Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: 📦 Compile Play Store Release Bundle (AAB)
        working-directory: frontend/android
        run: ./gradlew bundleRelease --no-daemon

      - name: 📤 Upload Debug APK (Direct Install for Phone)
        uses: actions/upload-artifact@v4
        with:
          name: recon-platform-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: 📤 Upload Google Play Store Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: recon-platform-playstore-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
