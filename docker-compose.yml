version: '3.8'

services:
  # 1. PostgreSQL Database (recon_db)
  # Mapped to host port 5433 because 5432 is already in use by local Postgres
  postgres:
    image: postgres:16-alpine
    container_name: recon-postgres
    environment:
      POSTGRES_DB: recon_db
      POSTGRES_USER: recon_user
      POSTGRES_PASSWORD: recon_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_recon_data:/var/lib/postgresql/data

  # 2. Apache Zookeeper (Kafka Cluster Coordinator)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: recon-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # 3. Apache Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: recon-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # 4. Redis (Sub-millisecond In-Memory Cache)
  redis:
    image: redis:7-alpine
    container_name: recon-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_recon_data:
