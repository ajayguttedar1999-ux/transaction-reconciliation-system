apiVersion: v1
kind: ConfigMap
metadata:
  name: recon-config
  namespace: recon-system
data:
  DB_HOST: "recon-postgres"
  DB_PORT: "5432"
  DB_NAME: "recon_db"
  KAFKA_BOOTSTRAP_SERVERS: "recon-kafka:9092"
  REDIS_HOST: "recon-redis"
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: recon-secrets
  namespace: recon-system
type: Opaque
stringData:
  DB_USERNAME: "recon_user"
  DB_PASSWORD: "recon_password"
