apiVersion: apps/v1
kind: Deployment
metadata:
  name: recon-postgres
  namespace: recon-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recon-postgres
  template:
    metadata:
      labels:
        app: recon-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: recon-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: recon-secrets
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recon-secrets
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: recon-postgres
  namespace: recon-system
spec:
  selector:
    app: recon-postgres
  ports:
    - port: 5432
      targetPort: 5432
