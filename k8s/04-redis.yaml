apiVersion: apps/v1
kind: Deployment
metadata:
  name: recon-redis
  namespace: recon-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recon-redis
  template:
    metadata:
      labels:
        app: recon-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: recon-redis
  namespace: recon-system
spec:
  selector:
    app: recon-redis
  ports:
    - port: 6379
      targetPort: 6379
