apiVersion: apps/v1
kind: Deployment
metadata:
  name: position-cache-service
  namespace: recon-system
  labels:
    app: position-cache-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: position-cache-service
  template:
    metadata:
      labels:
        app: position-cache-service
    spec:
      containers:
        - name: position-cache-service
          image: position-cache-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          env:
            - name: QUARKUS_REDIS_HOSTS
              value: "redis://recon-redis:6379"
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: recon-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: QUARKUS_REDIS_DEVSERVICES_ENABLED
              value: "false"
            - name: QUARKUS_KAFKA_DEVSERVICES_ENABLED
              value: "false"
          readinessProbe:
            httpGet:
              path: /api/v1/cache/health
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: position-cache-service
  namespace: recon-system
spec:
  selector:
    app: position-cache-service
  ports:
    - port: 8085
      targetPort: 8085
