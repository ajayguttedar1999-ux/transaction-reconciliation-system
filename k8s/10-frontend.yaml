apiVersion: apps/v1
kind: Deployment
metadata:
  name: recon-frontend
  namespace: recon-system
  labels:
    app: recon-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recon-frontend
  template:
    metadata:
      labels:
        app: recon-frontend
    spec:
      containers:
        - name: frontend
          image: recon-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: recon-frontend
  namespace: recon-system
spec:
  type: NodePort
  selector:
    app: recon-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
