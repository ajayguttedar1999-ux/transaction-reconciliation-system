apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: recon-ingress
  namespace: recon-system
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - http:
        paths:
          - path: /api/v1/transactions
            pathType: Prefix
            backend:
              service:
                name: transaction-service
                port:
                  number: 8081
          - path: /api/v1/positions
            pathType: Prefix
            backend:
              service:
                name: position-service
                port:
                  number: 8082
          - path: /api/v1/reconciliations
            pathType: Prefix
            backend:
              service:
                name: reconciliation-service
                port:
                  number: 8083
          - path: /api/v1/stale
            pathType: Prefix
            backend:
              service:
                name: stale-detection-service
                port:
                  number: 8084
          - path: /api/v1/cache
            pathType: Prefix
            backend:
              service:
                name: position-cache-service
                port:
                  number: 8085
          - path: /
            pathType: Prefix
            backend:
              service:
                name: recon-frontend
                port:
                  number: 80
