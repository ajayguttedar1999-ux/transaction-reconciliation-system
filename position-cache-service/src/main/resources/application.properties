# ========================================================
# Service 5: Quarkus Position Cache Service Configuration
# ========================================================

# HTTP Port (Distinct from Services 1-4)
quarkus.http.port=8085
quarkus.http.cors=true
quarkus.http.cors.origins=*

# Application Info
quarkus.application.name=position-cache-service
quarkus.application.version=1.0.0-SNAPSHOT

# Redis Connection (Running on Port 6379 in Docker)
quarkus.redis.hosts=redis://localhost:6379
quarkus.redis.timeout=2s
quarkus.redis.devservices.enabled=false

# Kafka Connection & Disable Dev Services
kafka.bootstrap.servers=localhost:9092
quarkus.kafka.devservices.enabled=false

# SmallRye Reactive Messaging - Kafka Incoming Channel
# Reads from 'position-created-topic'
mp.messaging.incoming.positions-in.connector=smallrye-kafka
mp.messaging.incoming.positions-in.topic=position-created-topic
mp.messaging.incoming.positions-in.group.id=quarkus-position-cache-group
mp.messaging.incoming.positions-in.auto.offset.reset=earliest
mp.messaging.incoming.positions-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.positions-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.recon.cache".level=DEBUG
