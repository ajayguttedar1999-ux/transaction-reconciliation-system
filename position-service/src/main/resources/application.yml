server:
  port: 8082

spring:
  application:
    name: position-service

  datasource:
    url: jdbc:postgresql://localhost:5433/recon_db
    username: recon_user
    password: recon_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: position-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.recon.common.event"
        spring.json.value.default.type: "com.recon.common.event.TransactionBookedEvent"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

app:
  kafka:
    topics:
      transaction-booked: transaction-booked-topic
      position-created: position-created-topic

logging:
  level:
    com.recon: DEBUG
