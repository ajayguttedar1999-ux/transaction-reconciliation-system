version: '3.8'

services:
  recon-splunk:
    image: splunk/splunk:9.2.0
    container_name: recon-splunk
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_PASSWORD=SplunkPassword123!
      - SPLUNK_HEC_PORT=8088
      - SPLUNK_HEC_TOKEN=b89e32a1-0000-4b32-a901-789a42cd90ab
    ports:
      - "8000:8000"  # Splunk Web UI
      - "8088:8088"  # HTTP Event Collector (HEC)
      - "9997:9997"  # Forwarder port
    networks:
      - recon-network

networks:
  recon-network:
    name: recon-network
    external: false
